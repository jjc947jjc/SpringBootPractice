<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生管理系统</title>
    <style>


        body {
            font-family: "Microsoft YaHei", sans-serif;
            padding: 0 20px 20px 260px;
            background: #f5f5f5;
        }

        .first {
            background-color: dodgerblue;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
        }
        .first h1 { color: aliceblue; font-weight: bold; }
        .first a  { color: aliceblue; text-decoration: none; }

        .top-bar {
            display: flex;
            gap: 10px;
            margin: 30px 0 25px;
            align-items: center;
            flex-wrap: wrap;
        }

        input, button { padding: 6px 10px; }
        button { cursor: pointer; }

        table {
            border-collapse: collapse;
            background: white;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 6px;
            text-align: center;
        }
        th { background: dodgerblue; color: white; }


        th:not(:last-child) { width: 80px; }
        table{
            width: 100%;
        }


        th:last-child { width: 150px; }
        td:last-child { white-space: nowrap; }
        td:last-child button { margin: 0 5px; }

        .msg { text-align: center; color: #999; }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .update-box{
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        .update-box input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }
        .sidebar { position: fixed; width: 200px; }
        .main    { margin-left: 200px; }
        .page { display: none; }
        .page.active { display: block; }

    </style>
</head>
<body>

<div class="sidebar">
<section id="pageList" class="page active" onclick="switchPage(this)">学生管理</section>
<section id="pageCompete"  class="page" onclick="switchPage(this)">班级成绩比拼</section>
<section id="pageInformation" class="page" onclick="switchPage(this)">个人信息</section>
</div>

<div class="main">
<div class="first">
    <h1>学生管理系统</h1>
    <a href="http://localhost:8080/login.html">退出登录</a>
</div>


<div class="top-bar">
    <input id="searchInputByName" placeholder="输入姓名搜索">
    <input id="searchInputById" placeholder="输入学号搜索">
    <button onclick="searchStudent()">搜索</button>
    <input id="addName" placeholder="姓名">
    <input id="addGender" placeholder="性别">
    <input id="addClassId" placeholder="班级">
    <input id="addScore" placeholder="分数">
    <button onclick="addStudent()">新增</button>
    <button onclick="again()">重置</button>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>姓名</th>
        <th>性别</th>
        <th>班级</th>
        <th>分数</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody id="tbody"></tbody>
</table>

<p id="msg" class="msg"></p>




<div id="updateOverlay" class="overlay" style="display: none;">
    <div class="update-box">
        <h2>编辑学生信息</h2>
        <label>姓名</label>
        <input id="name" type="text" >
        <label>性别</label>
        <input id="gender" type="text">
        <label>班级</label>
        <input id="classId" type="text" >
        <label>分数</label>
        <input id="score" type="text">

        <button onclick="update()">确认</button>
        <button onclick="misUpdate()">取消</button>
    </div>
  </div>
</div>










<script>

    function request(url, method, data) {
        let options = {
            method: method,
            headers: { "Content-Type": "application/json" }
        };
        if (data) {
            options.body = JSON.stringify(data);
        }
        return fetch(url, options).then(async res => {
            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                return { code: 0, message: "请求失败：HTTP " + res.status };
            }
        });
    }
    let currentEditId =null;

    function loadAll() {
        request("http://localhost:8080/students", "GET").then(result => {
            if (result.code === 1) {
                renderTable(result.data);
            } else {
                showMsg(result.message);
            }
        });
    }
    function switchPage(menuItem) {

        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

        document.getElementById(menuItem.dataset.page).classList.add('active');

        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        menuItem.classList.add('active');
    }



    function renderTable(students) {
        let html = "";
        for (let stu of students) {
            html += `<tr>
                    <td>${stu.id}</td>
                    <td>${stu.name}</td>
                    <td>${stu.gender}</td>
                    <td>${stu.classId}</td>
                    <td>${stu.score}</td>
                    <td><button onclick="updateStudent(${stu.id})">编辑</button>
                    <button onclick="deleteStudent(${stu.id})">删除</button></td>

                </tr>`;
        }
        document.getElementById("tbody").innerHTML = html;
    }


    function addStudent() {
        let stu = {
            name: document.getElementById("addName").value,
            gender: document.getElementById("addGender").value,
            classId:parseFloat(document.getElementById("addClassId").value),
            score: parseFloat(document.getElementById("addScore").value)
        };
        request("http://localhost:8080/students", "POST", stu).then(result => {
            if (result.code === 1) {
                showMsg("新增成功！");
                loadAll();
            } else {
                showMsg(result.message);
            }
        });
    }
    function again(){
            document.getElementById("addName").value="",
            document.getElementById("addGender").value="",
            document.getElementById("addClassId").value="",
            document.getElementById("addScore").value=""
    }


    function searchStudent() {
        let name = document.getElementById("searchInputByName").value.trim();
        let id = document.getElementById("searchInputById").value.trim();


        request("http://localhost:8080/students/search?name="+encodeURIComponent(name)+"&id="+encodeURIComponent(id) , "GET").then(result => {
            if (result.code === 1) {
                renderTable(result.data);
            } else {
                showMsg(result.message);
            }
        });
    }

    function updateStudent(id) {
        currentEditId=id;
        request("http://localhost:8080/students/" + id, "GET").then(result => {
            if(result.code===1) {
                let s = result.data;
                document.getElementById("name").value = s.name;
                document.getElementById("gender").value = s.gender;
                document.getElementById("classId").value = s.classId;
                document.getElementById("score").value = s.score;
                document.getElementById("updateOverlay").style.display = "flex";
            }else {
                showMsg(result.message);
            }
        });
    }

    function update(){
        let stu = {
            id: currentEditId,
            name: document.getElementById("name").value.trim(),
            gender: document.getElementById("gender").value.trim(),
            classId: parseFloat(document.getElementById("classId").value),
            score: parseFloat(document.getElementById("score").value)
        };
        request("http://localhost:8080/students" , "PUT",stu).then(result => {
            if (result.code===1){
                document.getElementById("updateOverlay").style.display = "none";
                showMsg("编辑成功!");
                loadAll();
            } else {
                showMsg(result.message);
            }
        });
    }

    function misUpdate(){
        document.getElementById("updateOverlay").style.display = "none";
    }


    function deleteStudent(id) {
        request("http://localhost:8080/students/" + id, "DELETE").then(result => {
            if (result.code === 1) {
                showMsg("删除成功！");
                loadAll();
            } else {
                showMsg(result.message);
            }
        });
    }


    function showMsg(msg) {
        document.getElementById("msg").textContent = msg;
    }

    window.onload = loadAll;
</script>

</body>
</html>
