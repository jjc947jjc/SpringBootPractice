<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生管理系统进入入口</title>
    <style>
        body{
            background: aqua;
        }
        .first{
            max-width: 900px;
            margin: 0 auto;
            font-size: 80px ;
            font-weight: bold;
            color:#999999;
            text-align: center;
            white-space: nowrap;
        }
        .second{
            height: 100px;
            max-width: 300px;
            margin: 0 auto;
            font-size: 80px ;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
        }
        .second:hover {
            transform: scale(1.2);
        }
        button{
            width:100%;
            height: 100%;
            font-size: 100%;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        .login-box input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }


    </style>
</head>
<body>
<div class="first">
<h1>学生管理系统</h1>
</div>
<div class="second">
<button onclick="goLogin()">进入</button>
</div>
<div id="loginOverlay" class="overlay" style="display: none;">
    <div class="login-box">
        <h2>用户登录</h2>
        <input id="username" type="text" placeholder="账号">
        <input id="password" type="password" placeholder="密码">
        <button onclick="doLogin()">登录</button>
        <button onclick="closeLogin()">取消</button>
    </div>
</div>
</body>
<SCRIPT>
    function request(url, method, data) {
        let options = {
            method: method,
            headers: { "Content-Type": "application/json" }
        };
        if (data) {
            options.body = JSON.stringify(data);
        }
        return fetch(url, options).then(res => res.json());
    }

    function goLogin() {
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document.getElementById("loginOverlay").style.display = "flex";
    }


    function closeLogin() {
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document.getElementById("loginOverlay").style.display = "none";
    }


    function doLogin() {
        let login = {
            password: document.getElementById("password").value,
            username: document.getElementById("username").value
        };
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        request("http://localhost:8080/login","POST",login).then(result =>{
            if ((result.code===1)){
                alert(result.message);
                window.location.href = "http://localhost:8080/index.html";
            }else {
                alert(result.message);
                closeLogin();
            }
        })
    }
</SCRIPT>
</html>
